    <h1>Billiard Gas</h1>

    <p>
      Event driven simulation of a billiard ball gas model in two dimensions. Temperature, entropy and chemical potentials computed using a smoothing kernel on individual gas particles. 
    </p>
    
    <div style="display: flex; justify-content: center; gap: 20px;">
      <figure style="text-align: center;">
        <video width="300" autoplay loop muted playsinline>
          <source src="assets/gas_particles.mp4" type="video/mp4">
        </video>
        <figcaption>Gas particles.</figcaption>
      </figure>

      <figure style="text-align: center;">
        <video width="300" autoplay loop muted playsinline>
          <source src="assets/gas_temperature.mp4" type="video/mp4">
        </video>
        <figcaption>Temperature flow.</figcaption>
      </figure>
    </div>

    <div style="display: flex; justify-content: center; gap: 20px;">
      <figure style="text-align: center;">
        <video width="300" autoplay loop muted playsinline>
          <source src="assets/gas_chemical_potential.mp4" type="video/mp4">
        </video>
        <figcaption>Chemical potential flow.</figcaption>
      </figure>

      <figure style="text-align: center;">
        <video width="300" autoplay loop muted playsinline>
          <source src="assets/gas_entropy.mp4" type="video/mp4">
        </video>
        <figcaption>Entropy flow.</figcaption>
      </figure>
    </div>

  </main>
